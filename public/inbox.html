<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KC WhatsApp · Keshav Clothing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-display: "Oswald", sans-serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
      --kc-black: #171717;
      --kc-gray-600: #525252;
      --kc-gray-500: #737373;
      --kc-gray-300: #d4d4d4;
      --kc-gray-200: #e5e5e5;
      --kc-gray-100: #f5f5f5;
      --kc-white: #ffffff;
      --kc-wa: #25d366;
      --kc-wa-dark: #128c7e;
      --bubble-out: #dcf8c6;
      --chat-bg: #ece5dd;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--kc-black);
      background: var(--kc-gray-100);
    }

    .login-wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        linear-gradient(180deg, var(--kc-black) 0 120px, var(--kc-gray-100) 120px 100%);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--kc-white);
      border: 1px solid var(--kc-gray-200);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
      padding: 40px 32px 32px;
      text-align: center;
    }
    .login-logo {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: var(--kc-black);
      color: #fff;
      display: grid;
      place-items: center;
      font-family: var(--font-display);
      font-weight: 700;
      letter-spacing: 1px;
    }
    .login-card h1 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .login-card p {
      margin: 0 0 24px;
      color: var(--kc-gray-500);
      font-size: 13px;
      line-height: 1.45;
    }
    .login-card input {
      width: 100%;
      border: 1px solid var(--kc-gray-200);
      border-radius: 4px;
      padding: 12px 14px;
      margin-bottom: 10px;
      font: inherit;
      outline: none;
    }
    .login-card input:focus { border-color: var(--kc-black); }
    .login-card button#loginBtn {
      width: 100%;
      margin-top: 8px;
      border: none;
      border-radius: 4px;
      padding: 14px;
      background: var(--kc-black);
      color: #fff;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
    }
    .login-card button#loginBtn:hover { opacity: .92; }
    .err { color: #b91c1c; font-size: 0.85rem; min-height: 1.2em; margin-top: 10px; }

    .app { display: none; height: 100%; }
    .app.on {
      display: grid;
      grid-template-columns: minmax(280px, 32%) 1fr;
      max-width: 1400px;
      margin: 0 auto;
      height: 100%;
      background: var(--kc-white);
      border-left: 1px solid var(--kc-gray-200);
      border-right: 1px solid var(--kc-gray-200);
    }
    @media (max-width: 860px) {
      .app.on { grid-template-columns: 1fr; }
      aside { max-height: 38vh; }
    }

    aside {
      border-right: 1px solid var(--kc-gray-200);
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--kc-white);
    }
    .aside-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--kc-gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: #fafafa;
      min-height: 64px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--kc-black); color: #fff;
      display: grid; place-items: center;
      font-family: var(--font-display);
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .avatar.sm { width: 48px; height: 48px; font-size: 0.85rem; }
    .avatar.wa { background: var(--kc-wa); }
    .brand-title {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .brand-sub { font-size: 12px; color: var(--kc-gray-500); }
    .aside-head button {
      border: 1px solid var(--kc-gray-200);
      background: #fff;
      color: var(--kc-gray-600);
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 10px;
      border-radius: 4px;
      font-family: var(--font-display);
      font-weight: 600;
    }
    .search { padding: 10px 12px; border-bottom: 1px solid var(--kc-gray-200); }
    .search input {
      width: 100%;
      border: 1px solid var(--kc-gray-200);
      background: var(--kc-gray-100);
      border-radius: 4px;
      padding: 10px 12px;
      font: inherit;
      font-size: 13px;
      outline: none;
    }
    #list { overflow: auto; flex: 1; }
    .conv {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 12px;
      padding: 14px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--kc-gray-200);
      align-items: center;
    }
    .conv:hover, .conv.active { background: #fafafa; }
    .conv .meta-row { display: flex; justify-content: space-between; gap: 8px; }
    .conv .name { font-weight: 600; font-size: 14px; }
    .conv .time { color: var(--kc-gray-500); font-size: 11px; }
    .conv .preview {
      color: var(--kc-gray-500);
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 3px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .badge {
      margin-left: auto;
      background: var(--kc-wa);
      color: #fff;
      border-radius: 999px;
      min-width: 20px; height: 20px;
      padding: 0 6px;
      font-size: 11px;
      font-weight: 700;
      display: inline-grid;
      place-items: center;
    }

    main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--chat-bg); }
    .chat-head {
      background: #fafafa;
      min-height: 64px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--kc-gray-200);
    }
    .chat-head .title {
      font-family: var(--font-display);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 15px;
    }
    .chat-head .sub { color: var(--kc-gray-500); font-size: 12px; }

    #thread {
      flex: 1;
      overflow: auto;
      padding: 20px 5% 12px;
      background-color: #e5ddd5;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23d4ccc4' fill-opacity='0.4'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .day { text-align: center; margin: 12px 0; }
    .day span {
      background: #fff;
      color: var(--kc-gray-500);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 5px 12px;
      border-radius: 4px;
      border: 1px solid var(--kc-gray-200);
    }
    .row { display: flex; margin: 2px 0 8px; }
    .row.in { justify-content: flex-start; }
    .row.out { justify-content: flex-end; }
    .bubble {
      max-width: min(65%, 520px);
      padding: 8px 10px 5px;
      border-radius: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,.06);
      line-height: 1.45;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .row.in .bubble { background: #fff; border-top-left-radius: 0; border: 1px solid var(--kc-gray-200); }
    .row.out .bubble { background: var(--bubble-out); border-top-right-radius: 0; }
    .bubble .time {
      float: right;
      margin: 6px 0 -2px 12px;
      color: var(--kc-gray-500);
      font-size: 10px;
      white-space: nowrap;
    }
    .bubble img.media, .bubble video.media {
      display: block; max-width: 100%; max-height: 280px; border-radius: 6px; margin-bottom: 4px;
    }
    .bubble a.doc { color: #027eb5; text-decoration: none; font-weight: 600; }
    .bubble audio { width: min(240px, 100%); margin-bottom: 4px; }

    .composer {
      background: #fafafa;
      border-top: 1px solid var(--kc-gray-200);
      padding: 10px 12px;
      display: grid;
      grid-template-columns: auto auto 1fr auto;
      gap: 8px;
      align-items: end;
    }
    .composer textarea {
      width: 100%;
      border: 1px solid var(--kc-gray-200);
      border-radius: 4px;
      padding: 12px 14px;
      font: inherit;
      font-size: 14px;
      resize: none;
      min-height: 46px;
      max-height: 120px;
      outline: none;
      background: #fff;
    }
    .icon-btn, .composer button.send {
      width: 46px; height: 46px; border: none; border-radius: 4px;
      background: transparent; color: var(--kc-gray-600);
      cursor: pointer; display: grid; place-items: center; padding: 0;
    }
    .icon-btn:hover { color: var(--kc-black); background: var(--kc-gray-200); }
    .icon-btn:disabled, .composer button.send:disabled { opacity: .45; cursor: not-allowed; }
    .composer button.send { background: var(--kc-black); color: #fff; border-radius: 4px; }
    .composer button.send:hover:not(:disabled) { background: #000; }
    .composer button.send svg, .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }
    .hint {
      grid-column: 1 / -1;
      color: var(--kc-gray-500);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 0 2px;
    }
    .empty {
      margin: 24px auto;
      text-align: center;
      color: var(--kc-gray-500);
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      border: 1px dashed var(--kc-gray-300);
      max-width: 360px;
      font-size: 13px;
      line-height: 1.45;
    }
    .placeholder-main {
      display: flex; align-items: center; justify-content: center;
      height: 100%; background: var(--kc-gray-100); text-align: center; padding: 40px;
    }
    .placeholder-main h2 {
      margin: 0 0 8px;
      font-family: var(--font-display);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-size: 28px;
    }
    .placeholder-main p { color: var(--kc-gray-500); font-size: 14px; margin: 0; max-width: 420px; }
  </style>
</head>
<body>
  <div class="login-wrap" id="login">
    <div class="login-card">
      <div class="login-logo">KC</div>
      <h1>WhatsApp Desk</h1>
      <p>Keshav Clothing team inbox — authorized account only.</p>
      <div id="googleBtnWrap" style="display:none;margin:16px 0;min-height:44px"></div>
      <div id="orLine" style="display:none;color:var(--kc-gray-500);font-size:12px;margin:12px 0;text-transform:uppercase;letter-spacing:1px">or email + password</div>
      <input id="email" type="email" placeholder="keshavclothingkc@gmail.com" autocomplete="username" />
      <input id="pass" type="password" placeholder="Inbox password" autocomplete="current-password" />
      <button type="button" id="loginBtn">Continue</button>
      <div class="err" id="loginErr"></div>
    </div>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <div class="app" id="app">
    <aside>
      <div class="aside-head">
        <div class="brand">
          <div class="avatar">KC</div>
          <div>
            <div class="brand-title">Chats</div>
            <div class="brand-sub" id="whoLabel"></div>
          </div>
        </div>
        <button type="button" id="logoutBtn">Logout</button>
      </div>
      <div class="search">
        <input id="filter" placeholder="Search chats" />
      </div>
      <div id="list"></div>
    </aside>
    <main id="mainPane">
      <div class="placeholder-main" id="placeholder">
        <div>
          <h2>Keshav Clothing</h2>
          <p>Select a chat to reply. Messages sync with WhatsApp on +91 93284 15350 — history is kept for the team.</p>
        </div>
      </div>
      <div id="chatPane" style="display:none;flex-direction:column;height:100%;min-height:0">
        <div class="chat-head">
          <div class="avatar sm wa" id="chatAvatar">?</div>
          <div>
            <div class="title" id="chatTitle">Chat</div>
            <div class="sub" id="chatSub"></div>
          </div>
        </div>
        <div id="thread"></div>
        <div class="composer">
          <div class="hint" id="sessionHint"></div>
          <button type="button" class="icon-btn" id="attachBtn" title="Attach file">
            <svg viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
          </button>
          <button type="button" class="icon-btn" id="cameraBtn" title="Camera / photo">
            <svg viewBox="0 0 24 24"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2 7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
          </button>
          <input type="file" id="fileInput" hidden />
          <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden />
          <textarea id="reply" rows="1" placeholder="Type a message"></textarea>
          <button type="button" class="send" id="sendBtn" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const tokenKey = 'kc_inbox_token';
    const whoKey = 'kc_inbox_who';
    const emailKey = 'kc_inbox_email';
    let token = localStorage.getItem(tokenKey) || '';
    let who = localStorage.getItem(whoKey) || '';
    let email = localStorage.getItem(emailKey) || '';
    let activePhone = null;
    let allConversations = [];
    let googleClientId = null;

    async function loadLoginConfig() {
      try {
        const r = await fetch('/inbox/api/config').then((x) => x.json());
        if (r.historyForever === false) {
          const warn = document.createElement('p');
          warn.style.cssText = 'margin:0 0 16px;padding:10px 12px;background:#fff7ed;border:1px solid #fed7aa;border-radius:4px;color:#9a3412;font-size:12px;text-align:left;line-height:1.4';
          warn.textContent = 'History is not yet durable. Add free Turso keys on Render (see TEAM_INBOX.md) so chats survive redeploys.';
          document.querySelector('.login-card h1')?.after(warn);
        }
        googleClientId = r.googleClientId || null;
        if (googleClientId) {
          document.getElementById('googleBtnWrap').style.display = 'block';
          document.getElementById('orLine').style.display = 'block';
          const boot = () => {
            if (!window.google?.accounts?.id) return setTimeout(boot, 200);
            window.google.accounts.id.initialize({
              client_id: googleClientId,
              callback: async (resp) => {
                const r = await fetch('/inbox/api/google-login', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ credential: resp.credential })
                }).then((x) => x.json());
                if (!r.ok) {
                  document.getElementById('loginErr').textContent = r.error || 'Google Sign-In failed';
                  return;
                }
                token = r.token; who = r.who; email = r.email;
                localStorage.setItem(tokenKey, token);
                localStorage.setItem(whoKey, who);
                localStorage.setItem(emailKey, email);
                showApp();
              }
            });
            window.google.accounts.id.renderButton(document.getElementById('googleBtnWrap'), {
              theme: 'outline', size: 'large', width: 320, text: 'signin_with'
            });
          };
          boot();
        }
      } catch (_) {}
    }
    loadLoginConfig();

    async function api(path, opts = {}) {
      const res = await fetch(path, {
        ...opts,
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + token,
          ...(opts.headers || {})
        }
      });
      const data = await res.json().catch(() => ({}));
      if (res.status === 401) {
        localStorage.removeItem(tokenKey);
        location.reload();
        return null;
      }
      return { ok: res.ok, status: res.status, data };
    }

    function showApp() {
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').classList.add('on');
      document.getElementById('whoLabel').textContent = email || who;
      refreshList();
      setInterval(refreshList, 7000);
    }

    document.getElementById('loginBtn').onclick = async () => {
      const password = document.getElementById('pass').value;
      email = document.getElementById('email').value.trim().toLowerCase();
      const r = await fetch('/inbox/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, email })
      }).then((x) => x.json());
      if (!r.ok) {
        document.getElementById('loginErr').textContent = r.error || 'Login failed';
        return;
      }
      token = r.token; who = r.who; email = r.email;
      localStorage.setItem(tokenKey, token);
      localStorage.setItem(whoKey, who);
      localStorage.setItem(emailKey, email);
      showApp();
    };
    document.getElementById('pass').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
    document.getElementById('logoutBtn').onclick = () => {
      localStorage.removeItem(tokenKey);
      localStorage.removeItem(whoKey);
      localStorage.removeItem(emailKey);
      location.reload();
    };
    document.getElementById('filter').oninput = () => renderList();

    function initials(name, phone) {
      const s = (name || phone || '?').trim();
      const parts = s.split(/\s+/);
      if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
      return s.slice(0, 2).toUpperCase();
    }
    function fmtTime(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      return d.toLocaleDateString([], { day: 'numeric', month: 'short' });
    }

    async function refreshList() {
      if (!token) return;
      const r = await api('/inbox/api/conversations');
      if (!r?.ok) return;
      allConversations = r.data.conversations || [];
      renderList();
    }

    function renderList() {
      const q = (document.getElementById('filter').value || '').toLowerCase();
      const rows = allConversations.filter((c) => {
        const hay = ((c.name || '') + ' ' + c.phone).toLowerCase();
        return !q || hay.includes(q);
      });
      const el = document.getElementById('list');
      if (!rows.length) {
        el.innerHTML = '<div class="empty">No chats yet. Customer messages and order WhatsApps will appear here and stay in history.</div>';
        return;
      }
      el.innerHTML = rows.map((c) => {
        const title = c.name || ('+' + c.phone);
        const last = (c.messages || []).slice(-1)[0];
        const preview = last ? last.text : '';
        const unread = c.unread ? `<span class="badge">${c.unread}</span>` : '';
        return `<div class="conv ${c.phone === activePhone ? 'active' : ''}" data-phone="${c.phone}">
          <div class="avatar sm wa">${escapeHtml(initials(c.name, c.phone))}</div>
          <div>
            <div class="meta-row">
              <span class="name">${escapeHtml(title)}</span>
              <span class="time">${fmtTime(c.lastAt)}</span>
            </div>
            <div class="preview"><span style="flex:1;overflow:hidden;text-overflow:ellipsis">${escapeHtml(preview)}</span>${unread}</div>
          </div>
        </div>`;
      }).join('');
      el.querySelectorAll('.conv').forEach((node) => {
        node.onclick = () => openChat(node.dataset.phone);
      });
    }

    async function openChat(phone) {
      activePhone = phone;
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('chatPane').style.display = 'flex';
      const r = await api('/inbox/api/conversations/' + phone);
      if (!r?.ok) return;
      const c = r.data.conversation;
      const sessionOk = r.data.canReplySession;
      document.getElementById('chatTitle').textContent = c.name || ('+' + c.phone);
      document.getElementById('chatSub').textContent = '+' + c.phone + ' · WhatsApp';
      document.getElementById('chatAvatar').textContent = initials(c.name, c.phone);
      document.getElementById('sessionHint').textContent = sessionOk
        ? '24h window open · reply & media enabled'
        : '24h window closed · wait for customer message';
      document.getElementById('sendBtn').disabled = !sessionOk;
      document.getElementById('attachBtn').disabled = !sessionOk;
      document.getElementById('cameraBtn').disabled = !sessionOk;

      const thread = document.getElementById('thread');
      const msgs = c.messages || [];
      let html = '';
      let lastDay = '';
      for (const m of msgs) {
        const day = new Date(m.at).toDateString();
        if (day !== lastDay) {
          lastDay = day;
          const label = day === new Date().toDateString() ? 'Today' : new Date(m.at).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
          html += `<div class="day"><span>${label}</span></div>`;
        }
        const side = m.direction === 'inbound' ? 'in' : 'out';
        html += `<div class="row ${side}"><div class="bubble">${renderBubbleBody(m)}<span class="time">${fmtTime(m.at)}</span></div></div>`;
      }
      thread.innerHTML = html || '<div class="empty">No messages in this chat</div>';
      thread.scrollTop = thread.scrollHeight;
      renderList();
    }

    function mediaUrl(mediaId) {
      return '/inbox/api/media/' + encodeURIComponent(mediaId) + '?token=' + encodeURIComponent(token);
    }
    function renderBubbleBody(m) {
      const type = m.type || 'text';
      const cap = m.caption || m.text || '';
      if (m.mediaId && (type === 'image' || type === 'sticker')) {
        return `<img class="media" src="${mediaUrl(m.mediaId)}" alt="photo" />${cap && type === 'image' ? `<div>${escapeHtml(cap)}</div>` : ''}`;
      }
      if (m.mediaId && type === 'video') {
        return `<video class="media" controls src="${mediaUrl(m.mediaId)}"></video>${cap ? `<div>${escapeHtml(cap)}</div>` : ''}`;
      }
      if (m.mediaId && type === 'audio') return `<audio controls src="${mediaUrl(m.mediaId)}"></audio>`;
      if (m.mediaId && type === 'document') {
        const name = m.filename || m.text || 'Document';
        return `<a class="doc" href="${mediaUrl(m.mediaId)}" target="_blank" rel="noopener">📄 ${escapeHtml(name)}</a>${m.caption ? `<div>${escapeHtml(m.caption)}</div>` : ''}`;
      }
      return escapeHtml(m.text || '');
    }

    document.getElementById('sendBtn').onclick = sendReply;
    document.getElementById('reply').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); }
    });
    document.getElementById('attachBtn').onclick = () => {
      const input = document.getElementById('fileInput');
      input.accept = 'image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.zip,.txt';
      input.click();
    };
    document.getElementById('cameraBtn').onclick = () => document.getElementById('cameraInput').click();
    document.getElementById('fileInput').onchange = (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) sendMediaFile(f);
    };
    document.getElementById('cameraInput').onchange = (e) => {
      const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) sendMediaFile(f);
    };

    async function sendReply() {
      const text = document.getElementById('reply').value.trim();
      if (!text || !activePhone) return;
      document.getElementById('sendBtn').disabled = true;
      const r = await api('/inbox/api/reply', {
        method: 'POST',
        body: JSON.stringify({ phone: activePhone, text, who })
      });
      if (!r?.ok) {
        alert(r?.data?.error || 'Send failed');
        document.getElementById('sendBtn').disabled = false;
        return;
      }
      document.getElementById('reply').value = '';
      openChat(activePhone);
    }

    async function sendMediaFile(file) {
      if (!activePhone || !file) return;
      const caption = document.getElementById('reply').value.trim();
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('attachBtn').disabled = true;
      document.getElementById('cameraBtn').disabled = true;
      const fd = new FormData();
      fd.append('file', file);
      fd.append('phone', activePhone);
      fd.append('who', who);
      if (caption) fd.append('caption', caption);
      try {
        const res = await fetch('/inbox/api/media', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + token },
          body: fd
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) alert(data.error?.message || data.error || 'Upload failed');
        else { document.getElementById('reply').value = ''; openChat(activePhone); }
      } catch (err) {
        alert(err.message || 'Upload failed');
      }
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('attachBtn').disabled = false;
      document.getElementById('cameraBtn').disabled = false;
    }

    function escapeHtml(s) {
      return String(s || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    if (token) showApp();
  </script>
</body>
</html>
